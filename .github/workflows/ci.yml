# seq-resistome CI (CLAUDE.md D3, D10)
#
# Runs on every pull request, and by hand (workflow_dispatch); not on push to
# main, because only code a pull request's CI has passed is merged (the same
# choice as seq-triage, its D71). A first job lists what the pull request
# changed: the repository guard and R unit tests always run; the pipeline
# jobs only when something other than documentation changed; the conda
# end-to-end only when environments, modules or configuration changed. A
# skipped job counts as passed. A manual run runs everything.
#
# Every action is pinned to a full commit SHA, not a tag: a tag can be moved
# to point at different code, a SHA cannot. The tag is noted alongside.

name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  R_IMAGE: docker.io/rocker/r-ver:4.5.2@sha256:fd4ccdd3a4a6f7ef805e2daeee2a0fe3bf126bc231f36351223baecf5a595a4c
  NXF_VER: 26.10.2
  NXF_ANSI_LOG: false

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code:  ${{ steps.diff.outputs.code }}
      conda: ${{ steps.diff.outputs.conda }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE:  ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "conda=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$files"
          # Documentation and published validation results only: no pipeline run needed.
          code=$(printf '%s\n' "$files" | grep -vE '^(docs/|validation/V[0-9]+/outcomes/)|\.md$|^LICENSE$' | grep -c . || true)
          conda=$(printf '%s\n' "$files" | grep -cE '(^|/)environment\.yml$|^envs/|^modules/|^nextflow\.config$|^conf/|^\.github/workflows/' || true)
          echo "code=$([ "$code" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "conda=$([ "$conda" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  guard:
    name: Repository guard (no data, no CARD, no HPC details)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The local pre-commit hook can be skipped, so CI checks every tracked file.
      - name: Check every tracked file
        run: bash .githooks/check_repo.sh --all

  unit:
    name: R unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tables (counts, normalisation, detection, edge cases)
        run: |
          docker run --rm -v "$PWD":/w -w /w "$R_IMAGE" \
            Rscript tests/resistome_tables/test_resistome_tables.R

  e2e:
    name: End-to-end (-profile test), CARD cache, input checks
    needs: [changes, unit]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}   # login shell, so the conda env is active
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install launch environment from environment.yml
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: 26.7.2-0
          environment-file: environment.yml
          activate-environment: seq-resistome-dev
          conda-remove-defaults: true

      - name: Record versions
        run: |
          java -version
          nextflow -version

      # Offline: CARD's site is replaced by local files (D5).
      - name: CARD cache tests
        run: bash tests/card_cache/test_card_cache.sh

      # Downloads CARD into the runner's cache (~/.seq-resistome/card) for real.
      - name: Run pipeline on the test profile
        run: nextflow run main.nf -profile test,docker --outdir results

      - name: Check results
        run: |
          docker run --rm -v "$PWD":/w -w /w "$R_IMAGE" \
            Rscript tests/e2e/check_test_profile.R results tests/e2e/expected.tsv

      # The same samples handed over from seq-triage's results (D9): four
      # more are left out, each with seq-triage's reason. This second run
      # must use the CARD cache the first one filled.
      - name: Run pipeline on seq-triage's results
        run: |
          nextflow -log triage.log run main.nf -profile test,docker --outdir results_triage \
            --input tests/triage/samplesheet_triage.csv --triage_results tests/triage/triage_results
          grep -q 'reused from the cache' triage.log

      - name: Check seq-triage handoff results
        run: |
          docker run --rm -v "$PWD":/w -w /w "$R_IMAGE" \
            Rscript tests/e2e/check_test_profile.R results_triage tests/triage/expected_triage.tsv

      # Samplesheet checks (D4): each bad sheet stops with a message naming it.
      - name: Samplesheet checks
        run: bash tests/input/test_input.sh

      - name: Keep the tables and run records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-profile-results
          path: |
            results/*.tsv
            results/*.md
            results/pipeline_info/
            results_triage/*.tsv
            .nextflow.log
          if-no-files-found: warn
          retention-days: 14

  # The Linux lockfile must rebuild a working environment, so a stale
  # lockfile cannot go unnoticed; nf-core lint and --help use it.
  lockfile:
    name: Lockfile rebuild (linux-64), lint, --help
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Miniforge only
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: 26.7.2-0
          conda-remove-defaults: true

      - name: Rebuild the environment from the lockfile and run its tools
        run: |
          conda create -q -y -n fromlock --file envs/seq-resistome-dev.linux-64.lock.txt
          conda activate fromlock
          java -version
          nextflow -version
          nf-core --version

      # nf-core's standards checker, with the nf-core-organisation checks
      # switched off in .nf-core.yml, each with its reason. Any failure or
      # pipeline warning stops the job.
      - name: nf-core pipelines lint
        run: |
          conda activate fromlock
          version=$(sed -n "s/^ *version *= *'\([^']*\)'.*/\1/p" nextflow.config | head -1)
          echo "manifest.version: $version"
          release=""; case $version in *dev) ;; *) release="--release" ;; esac
          nf-core pipelines lint --dir . $release --json lint.json
          python3 -c "import json, sys; d = json.load(open('lint.json')); w = d['tests_warned']; print('pipeline lint warnings:', len(w)); [print('  ', t) for t in w]; sys.exit(1 if w else 0)"

      # --help is generated from nextflow_schema.json. The exit code is not
      # checked (nf-schema's is 0 on a Mac, 1 on Linux: seq-triage CI fix #2);
      # the text is.
      - name: --help lists the parameters
        run: |
          conda activate fromlock
          nextflow run . --help > help.txt 2>&1 || true
          cat help.txt
          grep -q -- 'Typical pipeline command' help.txt
          grep -q -- '--input' help.txt
          grep -q -- '--card_version' help.txt
          grep -q -- 'non-commercial research use' help.txt

  # The same test with conda instead of containers (HPCs without Apptainer).
  e2e-conda:
    name: End-to-end, conda (-profile test,conda)
    needs: [changes, unit]
    if: needs.changes.outputs.conda == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    env:
      NXF_CONDA_CACHEDIR: ${{ github.workspace }}/conda-envs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install launch environment from environment.yml
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: 26.7.2-0
          environment-file: environment.yml
          activate-environment: seq-resistome-dev
          conda-remove-defaults: true

      - name: Run pipeline on the test profile with conda
        run: nextflow run main.nf -profile test,conda --outdir results

      - name: Check results
        run: |
          docker run --rm -v "$PWD":/w -w /w "$R_IMAGE" \
            Rscript tests/e2e/check_test_profile.R results tests/e2e/expected.tsv

      - name: Tool versions under conda
        if: always()
        run: cat results/pipeline_info/software_versions.tsv
